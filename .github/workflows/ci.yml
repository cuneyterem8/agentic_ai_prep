name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run eval regression (mock)
        run: python -m src.evals.run_evals

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t agenticai-ing-prep:ci .

      - name: Smoke healthcheck in container
        run: |
          docker run -d --name agenticai-ci -p 18000:8000 \
            -e APP_ENV=staging \
            -e LLM_PROVIDER=mock \
            -e DATABASE_URL=sqlite:///./data/app.db \
            agenticai-ing-prep:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs agenticai-ci
          exit 1
